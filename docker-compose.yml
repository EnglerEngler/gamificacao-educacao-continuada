services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamificacao
      POSTGRES_USER: gamificacao
      POSTGRES_PASSWORD: gamificacao
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [postgres]
    ports: ["8080:8080"]
  pgadmin:
    image: dpage/pgadmin4:8
    depends_on: [postgres]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamificacao.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
volumes:
  postgres_data:
