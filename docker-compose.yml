services:
  postgres:
    image: postgres:16-alpine
    container_name: gamificacao-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamificacao
      POSTGRES_USER: gamificacao
      POSTGRES_PASSWORD: gamificacao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamificacao -d gamificacao"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [gamificacao_net]
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: gamificacao-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamificacao.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [gamificacao_net]
  app:
    build: .
    container_name: gamificacao-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamificacao
      SPRING_DATASOURCE_USERNAME: gamificacao
      SPRING_DATASOURCE_PASSWORD: gamificacao
    ports:
      - "8080:8080"
    networks: [gamificacao_net]
volumes:
  postgres_data:
  pgadmin_data:
networks:
  gamificacao_net:
    driver: bridge
