global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
  - job_name: iot
    static_configs:
      - targets: ['iot-gateway:8003']

